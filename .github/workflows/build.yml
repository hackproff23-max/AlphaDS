name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Baixar apktool e signer
        run: |
          get() { curl -sL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/releases/latest" | grep -oE 'https://[^"]+\.jar' | head -1; }
          curl -sL -o apktool.jar "$(get iBotPeaches/Apktool)"
          curl -sL -o signer.jar "$(get patrickfav/uber-apk-signer)"
          ls -la *.jar
      - name: Compilar
        run: java -jar apktool.jar b app -o out.apk
      - name: Compilar tela inicial (Java) e juntar ao APK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AJAR=$(ls $SDK/platforms/android-*/android.jar | sort -V | tail -1)
          D8=$(ls $SDK/build-tools/*/d8 | sort -V | tail -1)
          echo "android.jar: $AJAR"; echo "d8: $D8"
          mkdir -p jbuild/classes
          javac -source 8 -target 8 -bootclasspath "$AJAR" -d jbuild/classes $(find extra -name '*.java')
          "$D8" --lib "$AJAR" --min-api 21 --output jbuild $(find jbuild/classes -name '*.class')
          N=$(unzip -Z1 out.apk | grep -cE '^classes[0-9]*\.dex$')
          NEW=classes$((N+1)).dex
          cp jbuild/classes.dex "jbuild/$NEW"
          (cd jbuild && zip ../out.apk "$NEW")
          unzip -Z1 out.apk | grep -E '^classes[0-9]*\.dex$'
      - name: Assinar
        run: java -jar signer.jar -a out.apk --allowResign -o signed
      - uses: actions/upload-artifact@v4
        with:
          name: DraSticMini
          path: signed/*Signed.apk
